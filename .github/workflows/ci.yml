name: CI

# Bouwt de extensie, controleert syntax/manifest, draait de test-suite
# (jsdom + node:test) en het zijpaneel in Chromium bij elke push en pull request.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22 opzetten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependencies installeren
        run: npm ci || npm install

      - name: Bouwen (src/ -> dist/)
        run: npm run build

      # dist/ staat in versiebeheer omdat de extensie uitgepakt wordt geladen.
      # Wijkt de gecommitte bundel af van wat src/ oplevert, dan is er vergeten
      # te bouwen vóór het committen.
      - name: dist/ is actueel
        run: git diff --exit-code -- dist/

      - name: Syntax, manifest en beheerscherm controleren
        run: npm run check

      # Alleen fouten; de aanbevolen regels staan nog op waarschuwing.
      - name: ESLint
        run: npm run lint -- --quiet

      - name: Tests draaien (jsdom + fixtures)
        run: node --test --test-force-exit test/*.test.js

      # Het zijpaneel in een echte Chromium (lay-out op een smal en breed
      # paneel, schermafdrukken in het rapport) en de uitgepakte extensie zelf.
      - name: Chromium voor Playwright installeren
        run: npx playwright install --with-deps chromium

      - name: Zijpaneel en extensie in Chromium (Playwright)
        run: npx playwright test

      - name: Playwright-rapport bewaren
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

name: CI

# Bouwt de extensie, controleert syntax/manifest en draait de test-suite
# (jsdom + node:test) bij elke push en pull request.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22 opzetten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependencies installeren
        run: npm ci || npm install

      - name: Bouwen (src/ -> dist/)
        run: npm run build

      # dist/ staat in versiebeheer omdat de extensie uitgepakt wordt geladen.
      # Wijkt de gecommitte bundel af van wat src/ oplevert, dan is er vergeten
      # te bouwen vóór het committen.
      - name: dist/ is actueel
        run: git diff --exit-code -- dist/

      - name: Syntax, manifest en beheerscherm controleren
        run: npm run check

      - name: Tests draaien (jsdom + fixtures)
        run: node --test --test-force-exit test/*.test.js

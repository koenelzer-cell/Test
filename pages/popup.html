<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ONS Agendahulp</title>
  <style>
    :root {
      color-scheme: light;
      /* Design-tokens: één bron van waarheid voor de merkkleur en de
         basismaten, ook gebruikt in beheer.html (--roze). */
      --roze: #cc087d;
      --roze-zacht: #fbeaf3;
      --tekst: #222;
      --tekst-zacht: #666;
      --rand: #e5e5e5;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      width: 380px; margin: 0; font: 14px/1.4 system-ui, sans-serif;
      background: #fff; color: var(--tekst);
    }
    header {
      background: var(--roze); color: #fff; padding: 12px 14px; font-weight: 700;
    }
    main { padding: 14px; }
    h2 { font-size: 13px; margin: 0 0 10px; color: #333; }
    button.choice {
      display: block; width: 100%; margin: 0 0 8px; padding: 11px 12px;
      border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 600;
      border: 1px solid var(--roze); background: #fff; color: var(--roze); text-align: left;
    }
    button.choice:hover { background: var(--roze-zacht); }
    button.choice.selected { background: var(--roze); color: #fff; }
    button.choice.disabled { opacity: .55; cursor: default; }
    .back {
      display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 10px;
      padding: 6px 8px; border-radius: var(--radius); cursor: pointer; font-size: 12px;
      border: 1px solid var(--roze); background: #fff; color: var(--roze); font-weight: 600;
    }
    .back:hover { background: var(--roze-zacht); }
    .status { font-size: 12px; color: var(--tekst-zacht); margin-top: 8px; }
    .section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rand); }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .section-head h2 { margin: 0; }
    .hint { font-size: 11px; color: var(--tekst-zacht); }
    input[type=checkbox] { accent-color: var(--roze); }
    .day-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
    .day-check { display: inline-flex; align-items: center; gap: 6px; width: 46px; font-weight: 600; cursor: pointer; }
    .time-field { width: 64px; font: inherit; font-variant-numeric: tabular-nums; text-align: center; padding: 5px 6px; border: 1px solid var(--rand); border-radius: 6px; }
    .time-field:disabled { color: #aaa; background: #f6f6f6; }
    .time-field[aria-invalid=true] { border-color: #b3261e; }
    .section-actions { display: flex; gap: 8px; margin-top: 10px; }
    button.small, button.primary, button.danger {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: var(--radius);
      font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--roze); background: #fff; color: var(--roze);
    }
    button.small:hover { background: var(--roze-zacht); }
    button.primary { background: var(--roze); color: #fff; }
    button.danger { border-color: #b3261e; color: #b3261e; }
    :focus-visible { outline: 2px solid var(--roze); outline-offset: 2px; }
    .brand-footer {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 8px 14px; border-top: 1px solid var(--rand); background: #fafafa;
    }
    .brand-logo {
      display: block; width: 92px; max-height: 48px; object-fit: contain;
    }
    .copyright {
      color: #686868; font-size: 10px; font-weight: 600; white-space: nowrap;
    }
  </style>
</head>
<body>
  <header>ONS Agendahulp</header>
  <main>
    <div id="view"></div>
    <div class="status" id="status"></div>
  </main>
  <footer class="brand-footer" aria-label="Copyright">
    <img class="brand-logo" src="../assets/impegno-logo.png" alt="Impegno">
    <span class="copyright">© impegno 2026</span>
  </footer>
  <script src="../dist/popup.js"></script>
</body>
</html>
